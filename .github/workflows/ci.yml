name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build shared library.
        run: make

      - name: Test shared library.
        run: make test

      - name: Build examples.
        run: make examples
