name: Compile and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build library
        run: make

      - name: Test library
        run: make test

      - name: Build examples
        run: make examples
